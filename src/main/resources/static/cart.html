<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="styles.css"> </head>
<body>
<div class="container">
    <h2>🛒 Your Shopping Cart</h2>
    <ul id="cart-items">
        <li>Your cart is loading...</li>
    </ul>
    <h3>Total: $<span id="cart-total">0.00</span></h3>

    <button onclick="clearCart()" class="clear-button">Empty Cart</button>
    <button onclick="payCart()" class="clear-button-pay">Pay Cart</button>

    <p><a href="menu.html">Continue Shopping</a></p>
</div>

<script src="cart.js"></script>
<script>
    // Call the function to display the cart when the page loads
    displayCart();
</script>
</body>
</html>
